<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuVault Login</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

    <h1>DocuVault</h1>

    <p id="formSubtitle">Sign in to continue</p>

 <div id="username-group" style="display:none;">
    <input type="text" id="username" placeholder="Username">
</div>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<div id="confirm-group" style="display:none;">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
</div>

<button id="loginBtn">Login</button>

<p id="login-message"></p>

<p id="toggleText">
    <span id="toggleMessage">Don't have an account?</span>
    <a href="#" id="toggleLink">Sign Up</a>
</p>



</div>

<script src="login.js"></script>

</body>
</html>
